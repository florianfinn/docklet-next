# Deviations: Original native two-platform image checks and tag-gated OCI source/image publication.
name: Tools image
on:
  pull_request:
  push:
    branches: [main]
    tags: ['tools-v*']
permissions: {}
jobs:
  verify:
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check static build contract
        run: node --test tests/tools-image.test.mjs
      - name: Build and exercise the runtime
        run: |
          node deploy/tools/build.mjs --platform "linux/$ARCH" --load --tag "docklet-tools:ci-$ARCH"
          node deploy/tools/contract.mjs "docklet-tools:ci-$ARCH"
      - name: Build the matching complete corresponding source image
        run: |
          node deploy/tools/build.mjs --platform "linux/$ARCH" --target corresponding-source --load --tag "docklet-tools-source:ci-$ARCH"
          node deploy/tools/source-contract.mjs "docklet-tools:ci-$ARCH" "docklet-tools-source:ci-$ARCH"
          mkdir -p bundle
          docker image save "docklet-tools:ci-$ARCH" "docklet-tools-source:ci-$ARCH" --output bundle/images.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools-${{ matrix.arch }}
          path: bundle/images.tar
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
  publish:
    needs: verify
    concurrency:
      group: tools-image-publish-${{ github.ref }}
      cancel-in-progress: false
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/tools-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/florianfinn/docklet-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Require a stable SemVer tag on main history
        run: |
          version=${GITHUB_REF_NAME#tools-v}
          printf '%s\n' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tools-*
          path: images
      - name: Publish corresponding source before runtime images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          trap 'docker logout ghcr.io' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          node deploy/tools/publish-check.mjs "$IMAGE" "$VERSION" "$GITHUB_REPOSITORY"
          for arch in amd64 arm64; do
            docker image load --input "images/tools-$arch/images.tar"
            docker tag "docklet-tools-source:ci-$arch" "$IMAGE:$VERSION-source-$arch"
            docker push "$IMAGE:$VERSION-source-$arch"
          done
          docker buildx imagetools create --tag "$IMAGE:$VERSION-source" \
            "$IMAGE:$VERSION-source-amd64" "$IMAGE:$VERSION-source-arm64"
          for arch in amd64 arm64; do
            docker tag "docklet-tools:ci-$arch" "$IMAGE:$VERSION-$arch"
            docker push "$IMAGE:$VERSION-$arch"
          done
          docker buildx imagetools create --tag "$IMAGE:$VERSION" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION-source"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
