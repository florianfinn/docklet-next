# Deviations: Root, Go and web checks, pinned toolchains, baseline comparison, Docker-isolated default SQLite checks and a separate package-image smoke gate.
name: Repository checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      value: ${{ steps.detect.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: detect
        run: echo "scope=$(node scripts/change-scope.mjs --ci)" >> "$GITHUB_OUTPUT"
  verify:
    name: verify
    needs: [scope]
    if: always()
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "0"
      CHECK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      GOFLAGS: -p=2
      VITEST_MAX_WORKERS: 2
    steps:
      - name: Require successful scope detection
        run: test '${{ needs.scope.result }}' = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/setup-git-hooks.mjs
      - run: node scripts/check-publication.mjs --history
      - if: needs.scope.outputs.value == 'text'
        run: node scripts/change-scope.mjs --run-text-tests
      - name: Enable pinned pnpm
        if: needs.scope.outputs.value != 'text'
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
      - name: Install frozen web dependencies
        if: needs.scope.outputs.value != 'text'
        run: pnpm --dir web install --frozen-lockfile
      - if: needs.scope.outputs.value != 'text'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            cli/go.sum
            types/go.sum
            third_party/arcane/**/go.sum
            third_party/francis/go.sum
      - if: needs.scope.outputs.value != 'text'
        name: Isolate checks from Docker daemons
        run: |
          sudo systemctl stop docker.service docker.socket containerd.service
          sudo rm -f /var/run/docker.sock /run/docker.sock
          unset DOCKER_HOST
          test ! -S /var/run/docker.sock
          test ! -S /run/docker.sock
      - if: needs.scope.outputs.value != 'text'
        run: pnpm run lint
      - if: needs.scope.outputs.value != 'text'
        run: pnpm run test
      - if: needs.scope.outputs.value != 'text'
        run: pnpm run build
  package-image:
    needs: scope
    if: needs.scope.outputs.value != 'text'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: docker build --tag docklet-next-hub:0.0.0 --file deploy/hub/Dockerfile .
      - run: node scripts/smoke-hub-image.mjs docklet-next-hub:0.0.0
  checks:
    name: checks
    needs: [scope, verify, package-image]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable check
        env:
          SCOPE: ${{ needs.scope.outputs.value }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          IMAGE_RESULT: ${{ needs.package-image.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$VERIFY_RESULT" = success
          case "$SCOPE" in
            text) test "$IMAGE_RESULT" = skipped ;;
            full) test "$IMAGE_RESULT" = success ;;
            *) exit 1 ;;
          esac
