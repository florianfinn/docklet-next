name: Repository checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    name: checks
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      CHECK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/setup-git-hooks.mjs
      - id: scope
        run: echo "scope=$(node scripts/change-scope.mjs --ci)" >> "$GITHUB_OUTPUT"
      - run: node scripts/check-publication.mjs --history
      - if: steps.scope.outputs.scope == 'text'
        run: node scripts/change-scope.mjs --run-text-tests
      - name: Enable pinned pnpm
        if: steps.scope.outputs.scope != 'text'
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
      - name: Install frozen web dependencies
        if: steps.scope.outputs.scope != 'text'
        run: pnpm --dir web install --frozen-lockfile
      - name: Root and web lint with TypeScript checks
        if: steps.scope.outputs.scope != 'text'
        run: pnpm run lint
      - name: Root guards and web tests
        if: steps.scope.outputs.scope != 'text'
        run: pnpm run test
      - name: Root checks and web build
        if: steps.scope.outputs.scope != 'text'
        run: pnpm run build
