# Deviations: Named review job, pending status on PR heads and trusted default branch for all write operations.
name: Independent review status
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
  statuses: write
jobs:
  review:
    name: review
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'Independent review'))
    concurrency:
      group: review-${{ github.event.issue.number || github.event.pull_request.number || 'main' }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      # This workflow never checks out or executes a pull request's code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/review-status.mjs
        env:
          GH_TOKEN: ${{ github.token }}
