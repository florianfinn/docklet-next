name: docklet-next
services:
  hub:
    image: ${HUB_IMAGE:-docklet-next-hub:0.0.0}
    build:
      context: ../..
      dockerfile: deploy/hub/Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${HUB_PORT:-3552}:3552"
    environment:
      APP_URL: ${APP_URL:-http://localhost:3552}
      AUTH_MODE: ${AUTH_MODE:-local}
      AUTH_PROXY_HEADER: ${AUTH_PROXY_HEADER:-Remote-User}
      AUTH_TRUSTED_PROXIES: ${AUTH_TRUSTED_PROXIES:-}
      AUTH_RESET_ADMIN_PASSWORD: ${AUTH_RESET_ADMIN_PASSWORD:-}
      AUTH_MODE_FILE: ${AUTH_MODE_FILE:-}
      AUTH_MODE__FILE: ${AUTH_MODE__FILE:-}
      AUTH_PROXY_HEADER_FILE: ${AUTH_PROXY_HEADER_FILE:-}
      AUTH_PROXY_HEADER__FILE: ${AUTH_PROXY_HEADER__FILE:-}
      AUTH_TRUSTED_PROXIES_FILE: ${AUTH_TRUSTED_PROXIES_FILE:-}
      AUTH_TRUSTED_PROXIES__FILE: ${AUTH_TRUSTED_PROXIES__FILE:-}
      AUTH_RESET_ADMIN_PASSWORD_FILE: ${AUTH_RESET_ADMIN_PASSWORD_FILE:-}
      AUTH_RESET_ADMIN_PASSWORD__FILE: ${AUTH_RESET_ADMIN_PASSWORD__FILE:-}
      DOCKLET_BACKUP_DIR: /var/lib/docklet/backups
      DATABASE_URL: file:/app/data/docklet.db
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in your private environment file}
      PUID: ${PUID:-65532}
      PGID: ${PGID:-65532}
      PROJECTS_DIRECTORY: /app/data/projects
      DOCKER_CONFIG: /app/data/.docker
    volumes:
      - hub-data:/app/data
      - hub-backups:/var/lib/docklet/backups
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  hub-data: {}
  hub-backups: {}
